# Publishes web/ on GitHub Pages as it is on main, the wasm modules of web/dsp
# and the atlas (web/atlas.json) included. Nothing is compiled here: the modules
# are built by faust-rs locally (make -B web) and the atlas by node (make
# web-atlas), and both are committed. The phone apps are then served from the
# published page's address (web/play/, the Phone tab's "this site's address").
name: Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
